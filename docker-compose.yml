services:
  keycloak:
    image: duclo/keycloak:latest
    container_name: keycloak
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8787:8787"
    volumes:
      - /usr/local/share/ca-certificates/somansa_root_ca.crt:/opt/keycloak/conf/truststores/somansa_root_ca.crt:ro
      - ../backend-keycloak-lib/target/backend-keycloak-lib-0.0.1-SNAPSHOT-jar-with-dependencies.jar:/opt/keycloak/providers/backend-keycloak-lib-0.0.1.jar
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: Init123!!!
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak?characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: init123
      KC_HTTP_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      DEBUG_PORT: "*:8787"
      DEBUG_SUSPEND: n
      KC_TRUSTSTORE_PATHS: /opt/keycloak/conf/truststores/somansa_root_ca.crt
    command: ["start-dev", "--features=organization", "--debug"]

  mysql:
    image: mysql:8.0.40
    container_name: keycloak-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-lock-wait-timeout=120
    environment:
      MYSQL_ROOT_PASSWORD: init123
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: keycloak
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pinit123 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mysql_data:
